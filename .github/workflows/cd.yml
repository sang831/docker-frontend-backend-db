name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Validate deployment settings
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TAILSCALE: ${{ secrets.TAILSCALE }}
        run: |
          set -Eeuo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_PRIVATE_KEY DEPLOY_KNOWN_HOSTS TAILSCALE; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production environment setting: $name" >&2
              exit 1
            fi
          done

          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "DEPLOY_HOST must be a hostname or IPv4 address." >&2; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*\$?$ ]] || { echo "DEPLOY_USER is not a valid Linux account name." >&2; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$DEPLOY_PATH" != *..* ]] || { echo "DEPLOY_PATH must be an absolute path without spaces or '..'." >&2; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] && (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 )) || { echo "DEPLOY_PORT must be between 1 and 65535." >&2; exit 1; }

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE }}
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy-ssh/id_ed25519" "$RUNNER_TEMP/deploy-ssh/known_hosts"
      - name: Add Tailscale host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 100.124.36.49 >> ~/.ssh/known_hosts
      - name: Copy tested source to server
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          
          # 1. Tự động quét và thêm host key của IP Tailscale vào known_hosts để tránh lỗi strict checking
          mkdir -p "$RUNNER_TEMP/deploy-ssh"
          ssh-keyscan -H -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> "$RUNNER_TEMP/deploy-ssh/known_hosts"
          
          # 2. Giữ nguyên lệnh rsync hiện tại của bạn
          rsync -az --delete \
            --filter='P /.env' \
            --filter='P /backend/.env' \
            --exclude='/.env' \
            --exclude='/backend/.env' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='**/node_modules/' \
            --exclude='**/dist/' \
            --exclude='**/build/' \
            -e "ssh -i $RUNNER_TEMP/deploy-ssh/id_ed25519 -p $DEPLOY_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      - name: Generate .env file on server
        env:
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          ssh -p "$DEPLOY_PORT" \
              -i "$RUNNER_TEMP/deploy-ssh/id_ed25519" \
              -o StrictHostKeyChecking=no \
              "$DEPLOY_USER@$DEPLOY_HOST" "cat << 'EOF' > /opt/todo-app/.env
          APP_USERNAME=$APP_USERNAME
          MONGO_URI=$MONGO_URI
          EOF"
      - name: Deploy and verify health
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH_B64="$(printf '%s' "$DEPLOY_PATH" | base64 -w 0)"
          ssh \
            -i "$RUNNER_TEMP/deploy-ssh/id_ed25519" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy-ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH_B64=$DEPLOY_PATH_B64 bash -s" <<'REMOTE'
          set -Eeuo pipefail
          DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH_B64" | base64 -d)"
          cd "$DEPLOY_PATH"
          docker compose config --quiet
          docker compose up --build -d --remove-orphans

          for attempt in {1..24}; do
            if response="$(curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/api/health 2>/dev/null)"; then
              if [[ "$response" == *'"status":"ok"'* ]]; then
                printf 'Deployment healthy: %s\n' "$response"
                docker compose ps
                exit 0
              fi
            fi
            sleep 5
          done

          echo "Deployment health check failed." >&2
          docker compose ps >&2
          docker compose logs --tail=100 web api mongo >&2
          exit 1
          REMOTE
