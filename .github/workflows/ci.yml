name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Compose configuration
        env:
          APP_USERNAME: ci-user
          APP_PASSWORD: ci-only-password-not-for-deployment
          JWT_SECRET: ci-only-signing-secret-not-for-deployment-0123456789
          MONGO_ROOT_USERNAME: ci-root
          MONGO_ROOT_PASSWORD: ci-only-mongo-password
        run: docker compose config --quiet

      - name: Build Docker images
        env:
          APP_USERNAME: ci-user
          APP_PASSWORD: ci-only-password-not-for-deployment
          JWT_SECRET: ci-only-signing-secret-not-for-deployment-0123456789
          MONGO_ROOT_USERNAME: ci-root
          MONGO_ROOT_PASSWORD: ci-only-mongo-password
        run: docker compose build
